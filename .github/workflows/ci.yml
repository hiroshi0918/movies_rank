name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    name: Minitest
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      RAILS_ENV: test
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: password
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.7
          bundler-cache: true

      - name: Prepare test database
        # schema.rb からテストDBを構築する（seedは外部ネットワークに依存するため使わない）
        run: bin/rails db:test:prepare

      - name: Run tests
        run: bin/rails test

  assets:
    name: Asset precompile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.7
          bundler-cache: true

      - name: Precompile assets
        env:
          SECRET_KEY_BASE_DUMMY: "1"
          RAILS_ENV: production
        run: bin/rails assets:precompile
